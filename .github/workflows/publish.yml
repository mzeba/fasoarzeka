# Publication sur PyPI via Trusted Publishing (OIDC, sans token).
#
# Configuration à faire une seule fois sur PyPI :
#   https://pypi.org/manage/project/fasoarzeka/settings/publishing/
#   -> Add a new publisher : GitHub, owner "mzeba", repository "fasoarzeka",
#      workflow "publish.yml", environment "pypi".
#
# Pour publier : mettre à jour `version` dans pyproject.toml, commiter,
# puis créer une release GitHub avec le tag correspondant (ex. 0.2.0).

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match pyproject version '$version'" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fasoarzeka/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
